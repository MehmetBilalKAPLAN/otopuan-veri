name: Haftalik veri guncelleme

on:
  schedule:
    - cron: '17 4 * * 1'      # her Pazartesi 04:17 UTC (Türkiye saatiyle 07:17)
  workflow_dispatch:           # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write              # güncel çıktıyı depoya işlemek için

concurrency:
  group: veri-guncelleme
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Birim test (ağsız)
        run: python test_wiki.py

      - name: Wikipedia'dan nesil ve yılları çek, karşılaştır
        run: |
          mkdir -p cikti
          python hepsi.py | tee cikti/ozet.txt
          {
            echo '### Oto Puan veri güncelleme özeti'
            echo '```'
            head -n 60 cikti/ozet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Değişiklik varsa depoya işle
        run: |
          git config user.name  "otopuan-bot"
          git config user.email "otopuan-bot@users.noreply.github.com"
          git add cikti/nesiller.json cikti/karsilastirma.csv cikti/ozet.txt
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Haftalık veri güncellemesi $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push denemesi $i başarısız, tekrar deneniyor"
              sleep 5
            done
          fi

      - name: Hosting'e yükle (FTP bilgileri tanımlıysa)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR:  ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "FTP secret'ları tanımlı değil, yükleme atlandı."
          else
            python deploy_ftp.py cikti/nesiller.json cikti/karsilastirma.csv
          fi
